# Curated correction table for well-known entities.
#
# WHY THIS EXISTS: Fundable's /industry/search and /location/search are literal
# fuzzy-name lookups with NO synonym handling, NO relevance score, and NO
# prominence ordering. Two concrete failure modes we hit live (2026-07-22):
#
#  1. Common shorthand returns ZERO results, so the filter silently drops:
#       "healthcare"  -> nothing (Fundable spells it "Health Care")
#       "cybersecurity" -> nothing ("Cyber Security")
#       "ecommerce"   -> nothing ("E-Commerce")
#       "ml"          -> nothing ("Machine Learning")
#     ...and "ai" matches "Agentic AI" before "Artificial Intelligence".
#
#  2. A name can match several places/permalinks with no way to rank them
#       "New York" -> New York, Chiapas (Mexico) is returned before NYC.
#
# So each entry below pairs the TERM a human types with (a) the `search` string
# Fundable actually accepts and (b) the exact `permalink` to select. This is NOT
# guessing: the resolver only uses a permalink if that exact value appears in the
# live search results. Every permalink here was verified against the live API.
# Extend freely — anything not listed falls through to normal search.

# ---- locations: term -> canonical permalink (picked from live results) -------
locations:
  "new york": new-york-new-york
  "nyc": new-york-new-york
  "america": united-states
  "usa": united-states
  "us": united-states
  "united states": united-states
  "the states": united-states
  "san francisco": san-francisco-california
  "sf": san-francisco-california
  "los angeles": los-angeles-california
  "la": los-angeles-california
  "london": london-england
  "boston": boston-massachusetts
  "austin": austin-texas
  "seattle": seattle-washington
  "chicago": chicago-illinois
  "berlin": berlin-berlin
  "paris": paris-ile-de-france
  "toronto": toronto-ontario
  "singapore": singapore-singapore
  "tel aviv": tel-aviv-tel-aviv

# ---- industries: term -> {search string Fundable accepts, permalink to pick} --
# `search` is what we send to /industry/search; `permalink` is verified-live.
industry_aliases:
  "healthcare":       {search: "health care",            permalink: health-care}
  "health care":      {search: "health care",            permalink: health-care}
  "healthtech":       {search: "health care",            permalink: health-care}
  "health tech":      {search: "health care",            permalink: health-care}
  "digital health":   {search: "health care",            permalink: health-care}
  "medtech":          {search: "medical device",         permalink: medical-device}
  "medical technology": {search: "medical device",       permalink: medical-device}
  "cybersecurity":    {search: "cyber security",         permalink: cyber-security}
  "cyber security":   {search: "cyber security",         permalink: cyber-security}
  "ecommerce":        {search: "e-commerce",             permalink: e-commerce-275d}
  "e commerce":       {search: "e-commerce",             permalink: e-commerce-275d}
  "climate":          {search: "clean energy",           permalink: clean-energy}
  "climate tech":     {search: "clean energy",           permalink: clean-energy}
  "climatetech":      {search: "clean energy",           permalink: clean-energy}
  "cleantech":        {search: "clean energy",           permalink: clean-energy}
  "ml":               {search: "machine learning",       permalink: machine-learning}
  "machine learning": {search: "machine learning",       permalink: machine-learning}
  "ai":               {search: "artificial intelligence", permalink: artificial-intelligence}
  "artificial intelligence": {search: "artificial intelligence", permalink: artificial-intelligence}
  "crypto":           {search: "cryptocurrency",         permalink: cryptocurrency}
  "cryptocurrency":   {search: "cryptocurrency",         permalink: cryptocurrency}
  "fintech":          {search: "fintech",                permalink: fintech-e067}
  "saas":             {search: "saas",                   permalink: saas-5c4e}

