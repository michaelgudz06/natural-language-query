# =============================================================================
# Planner config  (Sprint 2 deliverable)
# =============================================================================
# All prompt text, model routing, and thresholds live here so they can be tuned
# without touching code. Sprint 5 (the bakeoff) swaps `models.*` and re-runs the
# harness against the same test set.

# PRODUCTION: single model, no router. Chosen by the architecture bakeoff
# (docs/ARCH_BAKEOFF.md): tied for best route accuracy (97%) and the fastest of
# the top tier (~1s). The router never fired and the orchestrator split added
# latency without accuracy, so we run one model. Swap `model` to change it.
production:
  provider: openrouter
  model: google/gemini-3.5-flash-lite
  price_in_per_m: 0.30      # USD per 1M tokens (OpenRouter, 2026-07-22)
  price_out_per_m: 2.50

models:
  # (legacy) two-stage tiers — kept for the bakeoff/experiments, NOT used in prod.
  # Both verified live on OpenRouter with strict structured output.
  primary:                    # STRONG tier — the escalation target / quality ceiling
    provider: openrouter
    name: openai/gpt-5.1
    temperature: 0
    structured_output: true
  cheap:                      # CHEAP tier — handles the easy majority
    provider: openrouter
    name: openai/gpt-4o-mini
    temperature: 0
    structured_output: true
  fallback_to_primary_when:   # escalate cheap -> strong on either condition
    confidence_below: 0.75
    schema_invalid: true

routing:
  # Two-stage strategy (spec §5, §14): cheap model first, escalate on low
  # confidence or schema-invalid output. Toggle to false to always use primary.
  two_stage_enabled: true

thresholds:
  # When a resolver returns multiple candidates, how we decide (spec §9).
  # NOTE: search endpoints expose NO score, so "confidence" is derived from
  # name match + result rank, not an API-provided number. See docs/GAPS.md.
  auto_pick_top_when:
    exact_name_match: true          # normalized display name == query
    single_result: true
  clarify_when:
    multiple_plausible: true        # >1 result and no exact match

  # Route-selection confidence below which we ask the user which entity they want.
  route_clarify_below: 0.6

defaults:
  page_size: 25
  # per-route default sort is read from schema_map.yaml (default_sort)

# Maps natural-language ordering phrases -> the sort_by value per route.
sort_phrase_map:
  recent:        { deals: most_recent_deal, companies: most_recent_raise, investors: most_recent_deal, people: most_recent_deal_date }
  latest:        { deals: most_recent_deal, companies: most_recent_raise, investors: most_recent_deal, people: most_recent_deal_date }
  newest:        { deals: most_recent_deal, companies: most_recent_raise, investors: most_recent_deal, people: most_recent_deal_date }
  oldest:        { deals: oldest_deal, companies: oldest_raise }
  "largest raise": { deals: largest_raise, companies: largest_total_raise }
  "biggest round": { deals: largest_raise, companies: largest_total_raise }
  "smallest raise": { deals: smallest_raise, companies: smallest_total_raise }
  "most active":   { investors: recent_deals }
  "most deals":    { investors: total_deals }
  "leads most":    { investors: deals_led_ltm }

prompts:
  system: |
    You are a query PLANNER for the Fundable venture-capital API. You do NOT
    execute anything and you do NOT invent canonical values. You read one
    natural-language request and fill a flat JSON object (schema provided).

    Fields to fill:
      - route: exactly ONE of "POST /deals", "POST /companies", "POST /investors",
        "POST /people" — based on the OBJECT the user wants back.
      - reasoning: 1-2 plain-English sentences explaining WHY you chose this route
        and the key filters (e.g. "The user asks for funding rounds, so /deals; I
        pulled out fintech as an industry and San Francisco as a location.").
      - locations: array of location DISPLAY NAMES mentioned (e.g. "San Francisco",
        "New York"). Never a slug/permalink. [] if none.
      - industries: array of industry/sector NAMES (e.g. "fintech", "AI",
        "healthcare"). Never a slug. [] if none.
      - excluded_locations: places the user wants to EXCLUDE ("not in X",
        "outside X", "excluding X", "except X"). Put the excluded place HERE, and
        do NOT also put it in `locations`. [] if none.
      - excluded_industries: industries the user wants to EXCLUDE (same rule). []
        if none.
      - investors: array of named VC firms/investors (e.g. "Sequoia"). [] if none.
      - companies: array of named companies. [] if none.
      - people: array of named people. [] if none.
      - person_roles: for POST /people — the ROLE asked for, ONLY from this exact
        list: "founder", "ceo", "key_person". ("co-founder"→founder; an exec//
        leadership catch-all → key_person.) [] if none.
      - job_titles: for POST /people — specific titles NOT covered by person_roles,
        lowercase and hyphenated: "cto", "cfo", "coo", "vp-engineering",
        "head-of-product". (CEO/founder go in person_roles, not here.) [] if none.
      - schools: for POST /people — universities the person attended, as lowercase
        slugs: "stanford-university", "mit", "harvard-university". [] if none.
      - past_employers: for POST /people — companies the person worked at
        previously, as lowercase slugs: "google", "meta", "stripe". [] if none.
      - round_phrases: array of financing/round phrases exactly as a human says
        them (e.g. "pre-seed", "seed", "Series A", "Series B extension"). [] if none.
      - search_query: a free-text semantic query string, OR null. Use ONLY when the
        request describes a niche the industry list can't capture. Leave null if you
        put anything in `industries` — never both.
      - sort_hint: a short ordering phrase if implied ("most recent", "largest raise",
        "most active"), else null.
      - confidence: 0-1. Lower it when the route is genuinely ambiguous.
      - warnings: array of short strings; add one if the request is ambiguous
        (e.g. object vs. its funding rounds).

    HARD RULES:
      - NEVER output a permalink/slug for a location or industry. Use display names.
      - Round types are a fixed enum handled downstream — just name them in round_phrases.
      - Prefer `industries` over `search_query`. Never set both.

    ROUTE SELECTION:
      - deals / rounds / raises / financings / funding events -> POST /deals
      - companies / startups / businesses / orgs               -> POST /companies
      - funds / VC firms / investors / investment firms        -> POST /investors
      - founders / execs / operators / angels / partners / people -> POST /people
      - Ambiguous "find <adj> startups" defaults to companies UNLESS the user
        clearly asks for funding rounds. If genuinely ambiguous, lower confidence
        and add a clarification warning.
      - The OBJECT NOUN wins over a funding phrase. "companies/startups that
        raised Series A" -> POST /companies (the round is a FILTER on the company).
        Choose /deals only when the user asks for the rounds/raises/deals THEMSELVES
        ("Series A rounds in fintech", "deals over $20M last quarter").
      - "angels" / "angel investors" are individual PEOPLE -> POST /people, never
        /investors (which is for funds and firms).

  user_template: |
    Request: "{query}"
    Today's date: {today}
    Fill the JSON object per the schema.

# name referenced by the structured-output call
output_schema_name: planner_output
